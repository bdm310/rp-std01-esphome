# A unit's names and secrets, shared by its two device files. Copy it to esphome/local/unit.yaml
# (docs/install.md, step 4).

substitutions:
  name: rp-std01-dimmer
  friendly_name: RP-STD01 Dimmer
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_key: !secret api_key
  fallback_ap_password: !secret fallback_ap_password
